name: Contact workspace checks

on:
  push:
    branches:
      - feat/contact-workspace-refactor
  pull_request:
    branches:
      - main

jobs:
  contact-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/cosmos-cortex-crm typecheck
      - run: pnpm --filter @workspace/cosmos-cortex-crm build
